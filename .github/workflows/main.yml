name: Construire l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le dossier www
        run: |
          mkdir -p www/icons
          cp index.html manifest.json sw.js android-bridge.js www/
          # icônes : accepte le dossier icons/ OU les fichiers à la racine
          cp icons/*.png www/icons/ 2>/dev/null || true
          cp icon-*.png www/icons/ 2>/dev/null || true
          # branche le pont Android dans la page
          sed -i 's#</head>#<script src="android-bridge.js"></script></head>#' www/index.html
          grep -c 'android-bridge.js' www/index.html

      - name: Clé de signature (créée une seule fois)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=CartesID BF,O=CartesID,C=BF"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Ajout de la clé de signature"
            git push origin HEAD:${{ github.ref_name }}
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Installer Capacitor et créer le projet Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android

      - name: Réglages Android (caméra, version, icône)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$M"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle || true
          grep -n "CAMERA" "$M" || true

      - name: Icône de l'application
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          res = "android/app/src/main/res"
          icon = Image.open("www/icons/icon-512.png").convert("RGBA")
          mask = Image.open("www/icons/icon-512-maskable.png").convert("RGBA")
          bg = mask.getpixel((2, 2))[:3]
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, s in sizes.items():
              p = f"{res}/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              icon.resize((s, s), Image.LANCZOS).save(f"{p}/ic_launcher.png")
              icon.resize((s, s), Image.LANCZOS).save(f"{p}/ic_launcher_round.png")
              f = round(s * 108 / 48)
              mask.resize((f, f), Image.LANCZOS).save(f"{p}/ic_launcher_foreground.png")
          os.makedirs(f"{res}/values", exist_ok=True)
          open(f"{res}/values/ic_launcher_background.xml", "w").write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="ic_launcher_background">#%02X%02X%02X</color>\n</resources>\n' % bg)
          PY

      - name: Synchroniser et compiler
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CartesID-BF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CartesID-BF-apk
          path: CartesID-BF.apk

      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" CartesID-BF.apk \
            --title "CartesID BF v${{ github.run_number }}" \
            --notes "APK Android (installation hors Play Store)."
